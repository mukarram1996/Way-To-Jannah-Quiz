<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Way To Jannah Quiz</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
  body{background:linear-gradient(135deg,#06231C 0%,#0B3D2E 45%,#0A2A20 100%);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:15px}
  .card{background:linear-gradient(180deg,#FFFBEB,#FFF6D6);width:100%;max-width:480px;border-radius:22px;padding:26px 22px 22px;text-align:center;border:2px solid #C9A227;box-shadow:0 20px 50px rgba(0,0,0,0.5);position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#C9A227,#F5D76E,#C9A227)}
  .top{font-size:11px;letter-spacing:3px;color:#8A6D00;font-weight:800}
  h1{font-size:26px;color:#0B3D2E;margin:8px 0 2px}
  .sub{font-size:13px;color:#6B5B00;margin-bottom:16px}
  .bar{height:8px;background:#EADFAE;border-radius:99px;overflow:hidden;margin:10px 0 18px}
  .fill{height:100%;width:10%;background:linear-gradient(90deg,#0B3D2E,#C9A227);border-radius:99px;transition:0.4s}
  .qbox{background:#0B3D2E;color:white;padding:18px 16px;border-radius:16px;text-align:left;margin-bottom:16px;border:1px solid #C9A227}
  .qbox small{color:#F5D76E;letter-spacing:1px;font-weight:700}
  .qbox h2{font-size:19px;line-height:1.4;margin-top:6px}
  .timer{font-size:13px;font-weight:800;color:#0B3D2E;background:#F5D76E;display:inline-block;padding:5px 12px;border-radius:99px;margin-bottom:12px}
  .opt{width:100%;text-align:left;background:white;border:1.5px solid #E5D68A;padding:13px 14px;border-radius:12px;margin-bottom:10px;font-size:15px;font-weight:600;color:#1A1A1A;cursor:pointer}
  .opt.correct{background:#0B7A55;color:white}
  .opt.wrong{background:#B42318;color:white}
  #nextBtn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(90deg,#0B3D2E,#145A42);color:#F5D76E;font-size:16px;font-weight:800;cursor:pointer;margin-top:6px}
  .footer{font-size:11px;color:#8A6D00;margin-top:14px}
</style>
</head>
<body>
<div class="card">
  <div class="top">✦ BISMILLAH • ISLAMIC QUIZ ✦</div>
  <h1>WAY TO JANNAH<br>QUIZ GAME</h1>
  <p class="sub">Test your Islamic Knowledge • 10 Questions</p>
  <div class="timer" id="timer">⏱ Time Left: 20s</div>
  <div class="bar"><div class="fill" id="progress"></div></div>
  <div class="qbox"><small id="qnum">QUESTION 1 / 10</small><h2 id="question">Loading...</h2></div>
  <div id="options"></div>
  <button id="nextBtn" onclick="nextQ()">NEXT QUESTION →</button>
  <div class="footer">Made with ❤️ for Ummah • Way To Jannah</div>
</div>
<script>
const quiz=[
{q:"Sabse pehli Surah kaunsi nazil hui?",o:["Surah Fatiha","Surah Alaq","Surah Yaseen","Surah Baqarah"],a:1},
{q:"Quran me kitni Surah hain?",o:["110","114","116","120"],a:1},
{q:"Pehle Nabi kaun hain?",o:["Hazrat Musa (A.S)","Hazrat Isa (A.S)","Hazrat Adam (A.S)","Hazrat Ibrahim (A.S)"],a:2},
{q:"Sabse lambi Surah kaunsi hai?",o:["Surah Yaseen","Surah Baqarah","Surah Kahf","Surah Rahman"],a:1},
{q:"Roza kis mahine me farz hai?",o:["Muharram","Rajab","Ramzan","Shawwal"],a:2},
{q:"Kaaba kahan hai?",o:["Madina","Jerusalem","Makkah","Baghdad"],a:2},
{q:"Hazrat Muhammad (S.A.W) ka paidaish kahan hui?",o:["Madina","Makkah","Taif","Kufa"],a:1},
{q:"Quran kis raat me nazil hona shuru hua?",o:["Shab-e-Barat","Laylatul Qadr","Shab-e-Meraj","Eid ki raat"],a:1},
{q:"5 waqt ki Namaz me total kitni Rakat Farz hain?",o:["15","17","19","20"],a:1},
{q:"Jannat ke kitne darwaze hain?",o:["7","8","10","12"],a:1},
];
let idx=0,score=0,time=20,timer;
function load(){
  clearInterval(timer);time=20;
  document.getElementById("qnum").innerText=`QUESTION ${idx+1} / 10`;
  document.getElementById("question").innerText=quiz[idx].q;
  document.getElementById("progress").style.width=((idx+1)*10)+"%";
  let box=document.getElementById("options");box.innerHTML="";
  quiz[idx].o.forEach((opt,i)=>{
    let b=document.createElement("button");b.className="opt";b.innerText=opt;
    b.onclick=()=>check(b,i);box.appendChild(b);
  });
  document.getElementById("nextBtn").disabled=true;
  timer=setInterval(()=>{
    time--;document.getElementById("timer").innerText=`⏱ Time Left: ${time}s`;
    if(time<=0){clearInterval(timer);nextQ();}
  },1000);
  document.getElementById("timer").innerText=`⏱ Time Left: 20s`;
}
function check(btn,i){
  clearInterval(timer);
  let btns=document.querySelectorAll(".opt");
  btns.forEach(b=>b.disabled=true);
  if(i===quiz[idx].a){btn.classList.add("correct");score++;}
  else{btn.classList.add("wrong");btns[quiz[idx].a].classList.add("correct");}
  document.getElementById("nextBtn").disabled=false;
}
function nextQ(){
  idx++;
  if(idx>=quiz.length){
    document.querySelector(".card").innerHTML=`<h1 style="color:#0B3D2E">Masha Allah! 🎉</h1><p style="margin:15px 0">Tumhara Score</p><h1 style="font-size:60px;color:#C9A227">${score} / 10</h1><p style="margin:15px 0">${score>=7?"SubhanAllah! Tum Jannah ke raste par ho!":"Koshish jari rakho, Ilm badhao!"}</p><button onclick="location.reload()" style="padding:13px 20px;border:none;background:#0B3D2E;color:#F5D76E;border-radius:10px;font-weight:800">PLAY AGAIN</button>`;
    return;
  }
  load();
}
load();
</script>
</body>
</html>
