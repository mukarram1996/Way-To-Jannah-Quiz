<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
  body{
    background: linear-gradient(135deg,#06231C 0%,#0B3D2E 45%,#0A2A20 100%);
    min-height:100vh;display:flex;justify-content:center;align-items:center;padding:15px;
  }
  .card{
    background: linear-gradient(180deg,#FFFBEB 0%,#FFF6D6 100%);
    width:100%;max-width:480px;border-radius:22px;
    padding:26px 22px 22px;text-align:center;
    border:2px solid #C9A227;
    box-shadow:0 20px 50px rgba(0,0,0,0.5), 0 0 0 5px rgba(201,162,39,0.15);
    position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:6px;
    background:linear-gradient(90deg,#C9A227,#F5D76E,#C9A227);
  }
  .top{font-size:11px;letter-spacing:3px;color:#8A6D00;font-weight:800}
  h1{font-size:26px;color:#0B3D2E;margin:8px 0 2px;line-height:1.2}
  .sub{font-size:13px;color:#6B5B00;margin-bottom:16px}
  .bar{height:8px;background:#EADFAE;border-radius:99px;overflow:hidden;margin:10px 0 18px}
  .fill{height:100%;width:10%;background:linear-gradient(90deg,#0B3D2E,#C9A227);border-radius:99px;transition:0.4s}
  .qbox{
    background:#0B3D2E;color:white;padding:18px 16px;border-radius:16px;
    text-align:left;margin-bottom:16px;
    box-shadow:0 8px 20px rgba(11,61,46,0.3);
    border:1px solid #C9A227;
  }
  .qbox small{color:#F5D76E;letter-spacing:1px;font-weight:700}
  .qbox h2{font-size:19px;line-height:1.4;margin-top:6px}
  .timer{font-size:13px;font-weight:800;color:#0B3D2E;background:#F5D76E;display:inline-block;padding:5px 12px;border-radius:99px;margin-bottom:12px}
  .opt{
    width:100%;text-align:left;background:white;border:1.5px solid #E5D68A;
    padding:13px 14px;border-radius:12px;margin-bottom:10px;
    font-size:15px;font-weight:600;color:#1A1A1A;cursor:pointer;
  }
  .opt:hover{border-color:#C9A227;background:#FFFBEA}
  .opt.correct{background:#0B7A55;color:white;border-color:#0B7A55}
  .opt.wrong{background:#B42318;color:white;border-color:#B42318}
  #nextBtn{
    width:100%;padding:14px;border:none;border-radius:12px;
    background:linear-gradient(90deg,#0B3D2E,#145A42);
    color:#F5D76E;font-size:16px;font-weight:800;letter-spacing:1px;cursor:pointer;
    box-shadow:0 8px 18px rgba(11,61,46,0.35);margin-top:6px;
  }
  #nextBtn:disabled{opacity:0.5}
  .footer{font-size:11px;color:#8A6D00;margin-top:14px}
</style>
