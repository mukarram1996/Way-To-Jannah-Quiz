<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Way To Jannah - Islamic Quiz</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:linear-gradient(135deg,#0f5132,#1a8a4a,#ffd700);min-height:100vh;color:white;padding:15px}
.card{max-width:500px;margin:20px auto;background:rgba(0,0,0,.75);border-radius:20px;padding:25px;border:2px solid #ffd700;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
h1{font-size:32px;color:#ffd700} h1 span{font-size:16px;color:white;display:block}
p{margin:10px 0;opacity:.9}
input{width:100%;padding:14px;border-radius:12px;border:none;margin:12px 0;font-size:16px;text-align:center}
button{width:100%;padding:14px;border:none;border-radius:12px;background:#ffd700;color:#0f5132;font-weight:800;font-size:17px;cursor:pointer;margin-top:8px}
button:active{transform:scale(.98)}
.opt{background:white;color:#222;padding:14px;border-radius:12px;margin:8px 0;cursor:pointer;text-align:left;font-weight:600}
.opt:hover{background:#fff3b0}
.correct{background:#22c55e!important;color:white!important}
.wrong{background:#ef4444!important;color:white!important}
#quiz,#result{display:none}
.badge{background:#ffd700;color:#000;padding:5px 12px;border-radius:20px;font-weight:800;display:inline-block;margin:5px}
table{width:100%;margin-top:12px;border-collapse:collapse;font-size:14px}
td,th{padding:8px;border-bottom:1px solid #444;text-align:left}
th{color:#ffd700}
.progress{height:8px;background:#333;border-radius:10px;overflow:hidden;margin:10px 0}
#bar{height:100%;background:#ffd700;width:0%;transition:.3s}
</style>
</head>
<body>
<div class="card" id="start">
<h1>🕌 WAY TO JANNAH<span>Islamic Quiz Game</span></h1>
<p>10 Sawal • Har sahi jawab = 10 Points • Top 10 Leaderboard Live!</p>
<input id="pname" placeholder="Apna Naam Likho... e.g. Ahmed">
<button onclick="startGame()">▶️ GAME SHURU KARO</button>
<h3 style="margin-top:20px;color:#ffd700">🏆 LIVE LEADERBOARD</h3>
<div id="board">Loading...</div>
</div>

<div class="card" id="quiz">
<div style="display:flex;justify-content:space-between"><span id="qno"></span><span class="badge" id="score">Score: 0</span></div>
<div class="progress"><div id="bar"></div></div>
<h2 id="qtext" style="margin:15px 0;font-size:21px;line-height:1.4"></h2>
<div id="opts"></div>
</div>

<div class="card" id="result">
<h1>🎉 MashaAllah!</h1>
<h2 id="final" style="color:#ffd700;margin:15px 0"></h2>
<p id="msg"></p>
<button onclick="location.reload()">🔁 DOBARA KHELO</button>
<h3 style="margin-top:15px;color:#ffd700">🏆 LEADERBOARD</h3>
<div id="board2"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAl-CFpGaFN2O6c1BnBXK9qtqpB-WKHZm8",
  authDomain: "way-to-jannah-quiz.firebaseapp.com",
  databaseURL: "https://way-to-jannah-quiz-default-rtdb.firebaseio.com",
  projectId: "way-to-jannah-quiz",
  storageBucket: "way-to-jannah-quiz.firebasestorage.app",
  messagingSenderId: "342919632328",
  appId: "1:342919632328:web:b8e2bbcbdc9cc6a63fdcfd",
  measurementId: "G-HHGLSVCBX9"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const questions=[
{q:"Quran me kul kitni Surah hain?",o:["110","114","116","120"],a:1},
{q:"Pehli Wahi kahan nazil hui?",o:["Ghaar-e-Hira","Masjid-e-Nabawi","Ghaar-e-Saur","Badr"],a:0},
{q:"Sabse pehli Surah jo mukammal nazil hui?",o:["Surah Fatiha","Surah Baqarah","Surah Yaseen","Surah Ikhlas"],a:0},
{q:"Hazrat Muhammad (SAW) ka paidaish kahan hui?",o:["Madina","Makkah","Taif","Jerusalem"],a:1},
{q:"Namaz me kul kitne Farz hain?",o:["3","4","5","6"],a:2},
{q:"Roza kis mahine me farz hai?",o:["Shawwal","Ramadan","Zil-Hajj","Muharram"],a:1},
{q:"Quran ka sabse lamba Surah kaunsa hai?",o:["Surah Yaseen","Surah Baqarah","Surah Kahf","Surah Rahman"],a:1},
{q:"Kalma Tayyaba me kitne lafz hain?",o:["5","6","7","8"],a:2},
{q:"Jannat ke kitne darwaze hain?",o:["7","8","10","5"],a:1},
{q:"Hazrat Adam (AS) ko kis cheez se banaya gaya?",o:["Noor se","Mitti se","Aag se","Pani se"],a:1}
];
let idx=0,score=0,name="";
function startGame(){
  name=document.getElementById('pname').value.trim()||"Player";
  document.getElementById('start').style.display='none';
  document.getElementById('quiz').style.display='block';
  showQ();
}
function showQ(){
  if(idx>=questions.length){finish();return;}
  let qq=questions[idx];
  document.getElementById('qno').innerText=`Q ${idx+1}/10`;
  document.getElementById('qtext').innerText=qq.q;
  document.getElementById('bar').style.width=(idx*10)+"%";
  document.getElementById('opts').innerHTML=qq.o.map((op,i)=>`<div class="opt" onclick="check(${i},this)">${String.fromCharCode(65+i)}. ${op}</div>`).join('');
}
function check(i,el){
  let qq=questions[idx];
  let all=document.querySelectorAll('.opt');
  all.forEach(o=>o.style.pointerEvents='none');
  if(i===qq.a){el.classList.add('correct');score+=10;}
  else{el.classList.add('wrong');all[qq.a].classList.add('correct');}
  document.getElementById('score').innerText="Score: "+score;
  setTimeout(()=>{idx++;showQ();},900);
}
function finish(){
  document.getElementById('quiz').style.display='none';
  document.getElementById('result').style.display='block';
  document.getElementById('final').innerText=`${name} - Score: ${score}/100`;
  document.getElementById('msg').innerText= score>=80?"SubhanAllah! Tum Jannah ke raaste pe ho! 🤲":score>=50?"MashaAllah! Aur mehnat karo, Jannah qareeb hai!":"Koi baat nahi, seekhna hi Jannah ka raasta hai! Phir koshish karo!";
  db.ref('leaderboard').push({name:name,score:score,time:Date.now()});
}
function loadBoard(){
  db.ref('leaderboard').orderByChild('score').limitToLast(10).on('value',snap=>{
    let arr=[];snap.forEach(c=>arr.push(c.val()));arr.reverse();
    let html=`<table><tr><th>#</th><th>Naam</th><th>Score</th></tr>`+arr.map((r,i)=>`<tr><td>${i+1}</td><td>${r.name}</td><td><b>${r.score}</b></td></tr>`).join('')+`</table>`;
    if(arr.length===0) html="Abhi koi score nahi. Pehle tum khelo!";
    document.getElementById('board').innerHTML=html;
    document.getElementById('board2').innerHTML=html;
  });
}
loadBoard();
</script>
</body>
</html>
